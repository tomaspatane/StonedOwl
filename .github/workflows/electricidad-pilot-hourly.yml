name: StonedOwl Electricity Pilot Hourly

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: stonedowl-electricidad-hourly
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout electricity pilot branch
        uses: actions/checkout@v4
        with:
          ref: feat/electricidad-mvp-v01

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run electricity tests
        run: npm test

      - name: Restore previous electricity snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/restore-previous-electricidad.mjs

      - name: Capture live electricity snapshot
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          PREVIOUS_REPORT: tmp/previous-electricidad-report.json
        run: npm run smoke:electricidad

      - name: Upload snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stonedowl-electricidad-${{ github.run_id }}
          path: tmp/live-electricidad-report.json
          if-no-files-found: error
          retention-days: 14

  topics-capture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout topic pilot branch
        uses: actions/checkout@v4
        with:
          ref: feat/caba-topics-v01

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run topic and regression tests
        run: npm test

      - name: Restore previous topic snapshot
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/restore-previous-topics.mjs

      - name: Capture and persist CABA topic snapshot
        env:
          PREVIOUS_TOPICS_SNAPSHOT: tmp/previous-topics-snapshot.json
        run: npm run capture:topics

      - name: Upload topic snapshot and comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stonedowl-topics-${{ github.run_id }}
          path: tmp/topic-capture-artifact/*.json
          if-no-files-found: error
          retention-days: 14
