name: Electricity MVP checks

on:
  pull_request:
    paths:
      - 'data/**'
      - 'tests/**'
      - 'worker-v09.js'
      - 'src/worker.js'
      - 'package.json'
      - '.github/workflows/electricidad-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parser-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run test:electricidad
