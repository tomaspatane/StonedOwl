name: Electricity MVP checks

on:
  pull_request:
    paths:
      - 'data/**'
      - 'sources/**'
      - 'scripts/**'
      - 'tests/**'
      - 'worker-v09.js'
      - 'worker-v10.js'
      - 'src/worker.js'
      - 'package.json'
      - '.github/workflows/electricidad-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parser-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test

  live-source-smoke:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run live Google Web + ENRE probe
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
        run: npm run smoke:electricidad
      - name: Upload live report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-electricidad-report
          path: tmp/live-electricidad-report.json
          if-no-files-found: warn
